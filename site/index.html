<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Soil and Vegetation Indices</title>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--g:#12403a;}
*{box-sizing:border-box}
body{margin:0;background:#faf8f5;color:var(--g);font-family:'EB Garamond',Georgia,serif;}
.page{max-width:1100px;margin:0 auto;}
.top{background:var(--g);color:#f4f1e8;text-align:center;padding:16px;font-size:38px;letter-spacing:1px;}
.bar{display:flex;justify-content:center;flex-wrap:wrap;gap:20px 60px;padding:14px 0 6px;}
.field{display:flex;align-items:center;gap:16px;font-size:22px;font-weight:700;color:#0e2a4a}
.box{min-width:300px;background:#fff;border:1px solid #cfd4d2;border-radius:10px;padding:10px 18px;font:400 21px 'EB Garamond',Georgia,serif;color:#111}
.title{text-align:center;margin-top:6px}
.title h1{margin:0;font-size:32px;font-weight:700}
.title h2{margin:0;font-size:34px;font-weight:400}
.stage{display:flex;align-items:flex-start;justify-content:center;gap:22px;margin-top:6px}
.nav{align-self:center;flex:none;width:58px;height:58px;border-radius:50%;border:none;background:#fff;
     box-shadow:0 2px 8px rgba(0,0,0,.2);font-size:30px;color:var(--g);cursor:pointer}
.mapwrap{position:relative;width:min(780px,60vw);height:min(500px,40vw)}
.mapwrap img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;opacity:0;transition:opacity .5s}
.mapwrap img.on{opacity:1}
#nodata{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:22px;color:#777}
.legend{margin-top:120px;display:flex;gap:8px;height:250px;font-size:20px}
.grad{width:28px;border:1px solid #333}
.lab{display:flex;flex-direction:column;justify-content:space-between}
.dots{display:flex;justify-content:center;gap:14px;margin-top:14px}
.dot{width:16px;height:16px;border-radius:50%;background:#c8c8c8;transition:all .3s}
.dot.on{background:var(--g);width:20px;height:20px;margin-top:-2px}
.count{text-align:center;font-size:26px;font-weight:600;margin-top:6px}
.status{text-align:center;font-size:18px;margin-top:8px;color:#444}
.status button{margin-left:12px;border:1px solid #bbb;background:#fff;border-radius:6px;padding:2px 12px;font:inherit;cursor:pointer}
.prog{width:300px;height:4px;background:#ddd;margin:6px auto 0;border-radius:2px;overflow:hidden}
.prog div{height:100%;width:0;background:var(--g)}
.foot{margin:18px 30px 24px;border-top:1px solid #999;text-align:center;padding:12px 0;font-size:28px;font-weight:700;background:#e3efe8;border-radius:6px}
@media(max-width:700px){.top{font-size:22px}.box{min-width:200px}.legend{margin-top:40px;height:160px;font-size:15px}.nav{width:40px;height:40px;font-size:22px}
 .title h1{font-size:20px}.title h2{font-size:22px}.mapwrap{width:60vw;height:50vw}}
</style></head><body><div class="page">
<div class="top" id="ptitle">SOIL AND VEGETATION INDICES</div>
<div class="bar">
  <div class="field">Month <select class="box" id="month"></select></div>
  <div class="field">Region <select class="box" id="region"></select></div>
</div>
<div class="title"><h1 id="iname"></h1><h2 id="ikey"></h2></div>
<div class="stage">
  <button class="nav" id="prev">&#8249;</button>
  <div class="mapwrap"><img id="a"><img id="b"><div id="nodata">No imagery for this month</div></div>
  <div class="legend"><div class="grad" id="grad"></div><div class="lab"><span>High</span><span>Low</span></div></div>
  <button class="nav" id="next">&#8250;</button>
</div>
<div class="dots" id="dots"></div>
<div class="count" id="count"></div>
<div class="status"><span id="stxt"></span><button id="pp">Pause</button></div>
<div class="prog"><div id="pbar"></div></div>
<div class="foot" id="foot"></div>
</div>
<script>
const $ = id => document.getElementById(id);
fetch('data.json', {cache: 'no-cache'}).then(r => r.json()).then(D => {
  const DUR = (D.rotationSeconds || 5) * 1000;
  const NI = D.indices.length;
  let region = D.defaultRegion, S = [], N = 0;

  $('ptitle').textContent = D.title; document.title = D.title;
  $('foot').textContent = D.footer;
  $('grad').style.background = 'linear-gradient(to top,' + D.palette.join(',') + ')';
  D.months.forEach(m => $('month').add(new Option(m.label, m.value)));
  D.regions.forEach(r => $('region').add(new Option(r.name, r.slug)));
  $('region').value = region;
  for (let i = 0; i < NI; i++) { const d = document.createElement('div'); d.className = 'dot'; $('dots').appendChild(d); }

  // one slide per (month, index): all months play one after another
  function build() {
    S = [];
    D.months.forEach(m => D.indices.forEach((ix, k) => S.push({
      month: m.label, mval: m.value, name: ix.name, key: ix.key, pos: k,
      img: 'images/' + region + '/' + m.value + '/' + ix.key + '.png'
    })));
    N = S.length;
  }
  build();

  const imgs = [$('a'), $('b')]; let front = 0, cur = 0;
  function preload(k) { const p = new Image(); p.src = S[k].img; }
  function show(k) {
    cur = k; const s = S[k];
    const nxt = imgs[1 - front], old = imgs[front];
    nxt.onload = () => { nxt.classList.add('on'); old.classList.remove('on'); front = 1 - front; $('nodata').style.display = 'none'; };
    nxt.onerror = () => { imgs.forEach(i => i.classList.remove('on')); $('nodata').style.display = 'flex'; };
    nxt.src = s.img;
    if (nxt.complete && nxt.naturalWidth) nxt.onload();
    $('month').value = s.mval;
    $('iname').textContent = s.name;
    $('ikey').textContent = s.key;
    document.querySelectorAll('.dot').forEach((d, i) => d.classList.toggle('on', i === s.pos));
    $('count').textContent = (s.pos + 1) + ' / ' + NI;
    preload((k + 1) % N);
  }
  let elapsed = 0, last = performance.now(), paused = false;
  function go(step) { show((cur + step + N) % N); elapsed = 0; }
  setInterval(() => {
    const now = performance.now(), dt = Math.min(now - last, 1000); last = now;
    if (!paused) elapsed += dt;
    if (elapsed >= DUR) go(1);
    $('pbar').style.width = (elapsed / DUR * 100) + '%';
    $('stxt').textContent = paused ? 'Paused' :
      'Auto-playing • Next map in ' + Math.max(1, Math.ceil((DUR - elapsed) / 1000)) + 's';
  }, 100);
  $('prev').onclick = () => go(-1);
  $('next').onclick = () => go(1);
  $('pp').onclick = () => { paused = !paused; $('pp').textContent = paused ? 'Play' : 'Pause'; };
  $('month').onchange = e => { show(S.findIndex(s => s.mval === e.target.value)); elapsed = 0; };
  $('region').onchange = e => { region = e.target.value; build(); show(cur % NI + Math.floor(cur / NI) * NI); elapsed = 0; };
  show(0);
}).catch(() => { document.body.insertAdjacentHTML('beforeend', '<p style="text-align:center">Could not load data.json</p>'); });
</script></body></html>
